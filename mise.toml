[tools]
node = "22"
watchexec = "latest"
"cargo:sqlx-cli" = "latest"

[tasks.migrate]
description = "Run database migrations"
run = "cargo run -p pixelbin_migrations -- apply"

[tasks."run:server"]
description = "Run the API server"
run = "cargo run -p pixelbin_cli -- serve"
sources = [
  "packages/shared/Cargo.toml",
  "packages/shared/src/**/*.rs",
  "packages/migrations/Cargo.toml",
  "packages/migrations/src/**/*.rs",
  "packages/service/Cargo.toml",
  "packages/service/src/**/*.rs",
  "packages/cli/Cargo.toml",
  "packages/cli/src/**/*.rs",
]

[tasks."run:webapp"]
description = "Run the web server"
run = "node packages/webapp/server.mjs"
sources = [
  "packages/webapp/package.json",
  "packages/webapp/instrumentation.mjs",
  "packages/webapp/**/*.ts",
]

[tasks.lint]
description = "Lint the webapp"
run = "npm run lint"
sources = [
  "packages/webapp/**/*.json",
  "packages/webapp/**/*.ts",
  "packages/webapp/**/*.tsx",
  "packages/webapp/**/*.js",
  "packages/webapp/**/*.jsx",
  "packages/webapp/**/*.cjs",
  "packages/webapp/**/*.mjs",
]

[tasks.typecheck]
description = "Typecheck the webapp"
run = "npm run typecheck"
sources = [
  "packages/webapp/**/*.json",
  "packages/webapp/**/*.ts",
  "packages/webapp/**/*.tsx",
  "packages/webapp/**/*.js",
  "packages/webapp/**/*.jsx",
  "packages/webapp/**/*.cjs",
  "packages/webapp/**/*.mjs",
]

[tasks."build:server"]
description = "Build the Docker image for the pixelbin API server"
run = "docker build -t pixelbin-server -f packages/cli/Dockerfile ."

[tasks."build:webapp"]
description = "Build the Docker image for the pixelbin webapp server"
run = "docker build -t pixelbin-webapp -f packages/webapp/Dockerfile ."

[tasks."kill:server"]
run = "docker rm -f pixelbin-server"

[tasks."kill:webapp"]
run = "docker rm -f pixelbin-webapp"

[tasks."container:db"]
description = "Ensure that the database container for testing is running"
run = "docker compose -f testing/docker-compose.yml up -d"

[tasks."container:server"]
depends = ["container:server", "build:server", "kill:server"]
wait_for = ["build:webapp"]
description = "Run the pixelbin API server in a Docker container"
run = '''
  . .env && docker run -p 8283:8283 \
    -e "PIXELBIN_TESTING=$PIXELBIN_TESTING" \
    -e "PIXELBIN_LOG_LEVEL=trace" \
    -e "PIXELBIN_MAIL_SERVER=$PIXELBIN_MAIL_SERVER" \
    -e "PIXELBIN_DATABASE_URL=postgres://pixelbin:pixelbin@postgres/pixelbin" \
    -e "PIXELBIN_TELEMETRY_HOST=http://jaeger:4318/v1/traces" \
    -v $PWD/$PIXELBIN_STORAGE:/data \
    --network pixelbin \
    --name pixelbin-server \
    pixelbin-server
'''

[tasks."container:webapp"]
depends = ["build:webapp", "kill:webapp"]
wait_for = ["build:server"]
description = "Run the pixelbin webapp server in a Docker container"
run = '''
  . .env && docker run -p 3000:3000 \
    -e "PIXELBIN_LOG_LEVEL=trace" \
    -e "PIXELBIN_TELEMETRY_HOST=http://jaeger:4318/v1/traces" \
    --network pixelbin \
    --name pixelbin-webapp \
    pixelbin-webapp
'''
